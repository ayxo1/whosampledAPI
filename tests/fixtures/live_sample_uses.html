<!doctype html>
<html>
  <body>
    <h1 class="artistName">Example Artist</h1>
    <section class="trackList bordered-list">
      <section class="trackItem" itemprop="track">
        <header class="trackItemHead">
          <h3 class="trackName">
            <a href="/Example-Artist/Sampling-Recording/" itemprop="url">
              <span itemprop="name">Sampling Recording</span>
            </a>
            <span class="trackYear">(2024)</span>
            <span class="trackArtistName">by <strong>Example Artist</strong> feat.
              <a href="/Guest-Artist/">Guest Artist</a>
            </span>
          </h3>
        </header>
        <div class="trackConnections">
          <div class="track-connection">
            <span class="sampleAction">sampled</span>
            <ul>
              <li>
                <a class="connectionName playIcon" href="/sample/1/example-first/">First Source</a>
                by <a href="/Source-Artist/">Source Artist</a> (1971)
              </li>
              <li>
                <a class="connectionName playIcon" href="/sample/2/example-second/">Second Source</a>
                by <a href="/Another-Artist/">Another Artist</a> (1982)
              </li>
              <li>
                <a class="connectionName playIcon" href="/sample/3/example-film/">Film Source</a>
                from <a href="/Example-Film/">Example Film</a> (2007)
              </li>
            </ul>
          </div>
        </div>
      </section>
    </section>
  </body>
</html>
