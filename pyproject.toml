[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wsmpld"
version = "0.1.0"
description = "A loopback-only API for WhoSampled Sample Uses"
requires-python = ">=3.13"
dependencies = [
    "camoufox[geoip]==0.5.4",
    "curl_cffi==0.16.0",
    "fastapi==0.116.1",
    "lxml==6.0.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "lxml-stubs==0.5.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wsmpld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires visible Camoufox and live WhoSampled access",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["wsmpld"]
